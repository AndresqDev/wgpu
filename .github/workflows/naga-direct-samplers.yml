name: Naga direct samplers

on:
  workflow_dispatch:
  push:
    branches:
      - naga-hlsl-direct-samplers

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: Naga HLSL direct samplers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install 1.93 --profile minimal --component rustfmt
          rustup override set 1.93
          cargo -V

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: naga-direct-samplers

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test naga HLSL backend
        run: cargo test --locked -p naga --features hlsl-out,wgsl-in --lib
